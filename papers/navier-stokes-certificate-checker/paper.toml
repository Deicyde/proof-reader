[paper]
title = "Checking the Navier–Stokes certificate"
short_title = "Navier–Stokes blow-up: the certificate checker"
authors = ["Prepared by Will Cook with AI assistance"]
venue = "What a checker of Alpöge and Buckmaster’s certificate must establish"
