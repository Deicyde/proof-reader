scope = "Lean 4.33.1 compiled the authors' package, unchanged at ad53419, on GitHub Actions; this page reads the readable statement chain (Challenge.lean to CellLayerChallenge.lean), whose closing theorems are sorry stubs that Solution.lean proves. Each declaration's statement, dependencies and axioms shown here are Lean's own report from those compiled modules. The links from the text to the Lean, the plain titles, the notes and the comparisons were made with AI and have not been reviewed by the authors."

