[paper]
title = "Reading the proof routes"
short_title = "Navier–Stokes blow-up: proof routes"
authors = ["Prepared by Will Cook with AI assistance"]
venue = "Route map through Alpöge and Buckmaster’s library at ad53419"
markdown = "paper.md"
url = "https://github.com/wcook04/proof-reader/blob/main/papers/navier-stokes-routes/paper.md"
noun = "guide"
licence = "MIT"

[credit]
text = "Paper and Lean by Levent Alpöge and Tristan Buckmaster, from their repository tristanbuckmaster/navier-stokes at ad53419; their paper thanks Anthropic for supporting the collaboration from which it grew, and states that they used Anthropic's Claude models throughout the work. Text, links, plain titles, notes and comparisons prepared by Will Cook with AI assistance, MIT licence"

[lean]
project = "../navier-stokes-paper/lean"
modules = ["Breakdown.Base.Framework", "Breakdown.Base.Realization", "Breakdown.CellReduction.AdjointStatements", "Breakdown.CellReduction.CellLayerBreakdownClosed", "Breakdown.CellReduction.CellLayerBreakdownCompose", "Breakdown.CellReduction.InstanceStatements", "Breakdown.CellReduction.ReductionStatements", "Breakdown.Cert.ExtendedAssembly", "Breakdown.Cert.ExtendedExistsZeroHeld", "Breakdown.Cert.ExtendedHeldExistsUnique", "Breakdown.Cert.ExtendedMain", "Breakdown.Cert.ExtendedNodes", "Breakdown.Cert.ExtendedSigmaProfileOfHeld", "Breakdown.Cert.ExtendedStatement", "Breakdown.Cert.HalfOrderGraphMem", "Breakdown.Cert.Nodes", "Breakdown.Cert.ReadingEnergy", "Breakdown.Cert.Statement", "Breakdown.CertCell.AssemblyStatements", "Breakdown.CertCell.CellCalculusStatements", "Breakdown.CertCell.CellLayerClosed", "Breakdown.CertCell.CellLayerStatements", "Breakdown.CertCell.CertificateEnclosureStatements", "Breakdown.CertCell.StatementDefs", "Breakdown.CertTorus.Defs", "Breakdown.CertTorus.Main", "Breakdown.CertTorus.SmoothFieldClosed", "Breakdown.Defs", "Breakdown.FracCell.StatementDefs", "Breakdown.FracCert.Defs", "Breakdown.FreqTr.Basic", "Breakdown.FreqTr.EmbedDilate", "Breakdown.FreqTr.Realization", "Breakdown.FreqTr.Statements", "Breakdown.Held.Exports", "Breakdown.Held.Statements", "Breakdown.Profile.StatementsEmbed", "Breakdown.Profile.StatementsSlice", "Breakdown.Spectral.RealDichotomy", "Breakdown.Torus.Assembly", "Breakdown.Torus.Main", "Breakdown.Torus.MovingFrame", "Breakdown.Torus.StatementsAnalysis", "Breakdown.Torus.StatementsApprox", "Breakdown.Torus.StatementsApproxSteps", "Breakdown.Torus.StatementsInverse", "Breakdown.Torus.StatementsSeqOps", "Breakdown.Torus.StatementsShell", "Breakdown.Torus.StatementsSmooth", "Breakdown.Torus.StatementsSteps", "Breakdown.Transfer.Exports", "Breakdown.Transfer.Main", "Breakdown.Transfer.StatementsAbstract", "Breakdown.Transfer.StatementsDefs", "Breakdown.Transfer.StatementsFrame", "Breakdown.Transfer.StatementsLocal", "Breakdown.Uniqueness.Basic", "Breakdown.Uniqueness.Restrict", "Breakdown.Uniqueness.Space", "Breakdown.Weak.Basic", "Breakdown.Weak.Main", "Breakdown.Weak.OrbitOfParts", "Breakdown.Weak.StatementsOrbit", "Breakdown.Weak.StatementsSlice", "Breakdown.Weak.StatementsTime", "Solution"]
source = "https://github.com/tristanbuckmaster/navier-stokes/tree/ad53419de079eb8f95f60313473374624a348546/lean"
source_name = "navier-stokes at ad53419"
source_lines = "https://github.com/tristanbuckmaster/navier-stokes/blob/ad53419de079eb8f95f60313473374624a348546/lean/{path}#L{line}-L{end}"
licence = "none stated by the authors; hosted with credit to them, to Anthropic and to their repository"
scope = "Lean 4.33.1 compiled the authors' package, unchanged at ad53419, on GitHub Actions; this page reads the library (Breakdown and Solution). Each declaration's statement, dependencies and axioms shown here are Lean's own report from those compiled modules. The links from the text to the Lean, the plain titles, the notes and the comparisons were made with AI and have not been reviewed by the authors."

