# Compile the two Physlib modules the coupled-spring page links to, at Physlib's own
# toolchain and commit, read each declaration's dependencies and axioms from the compiled
# files, and compile the page's checks against them. The reports are uploaded for review,
# not published.
name: Extract coupled-spring dependencies from Lean
on:
  workflow_dispatch:
  push:
    branches: ['claude/coupled-spring-*']
    paths:
      - '.github/workflows/coupled-spring-extract.yml'
      - 'papers/coupled-spring/lean/**'
      - 'papers/coupled-spring/checks/**'
      - 'papers/coupled-spring/paper.toml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PHYSLIB_COMMIT: be0a9eef7dac78da524bfbde91c812340b194610
      MODULE: PhyslibAlpha.ClassicalMechanics.CoupledSpringPotential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Physlib at the pinned commit
        run: |
          git init -q "$RUNNER_TEMP/physlib"
          cd "$RUNNER_TEMP/physlib"
          git remote add origin https://github.com/leanprover-community/physlib.git
          git fetch -q --depth 1 origin "$PHYSLIB_COMMIT"
          git checkout -q FETCH_HEAD
          git rev-parse HEAD
      - name: Fetch Mathlib's compiled files (never built from source here)
        working-directory: ${{ runner.temp }}/physlib
        run: lake exe cache get
      - name: Compile the two modules
        working-directory: ${{ runner.temp }}/physlib
        run: |
          set -o pipefail
          lake build "$MODULE" 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -v '^✔' || true; }
      - name: Read dependencies and axioms from the compiled modules
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out" papers/coupled-spring/generated
          python3 tools/extract_built.py coupled-spring --project "$RUNNER_TEMP/physlib" 2>&1 | tee "$RUNNER_TEMP/out/extract.log"
          cp papers/coupled-spring/generated/lean.json "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/out/"
      - name: Compile the page's checks against the compiled modules
        run: |
          set -o pipefail
          python3 - <<'EOF' 2>&1 | tee "$RUNNER_TEMP/out/checks.log" || echo "checks failed" >> "$RUNNER_TEMP/failed"
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import paper
          folder = paper.PAPERS / "coupled-spring"
          project = Path(os.environ["RUNNER_TEMP"]) / "physlib"
          try:
              paper.extract_checks(folder, project)
          except paper.PaperError as error:
              print(error)
              sys.exit(1)
          EOF
          cp papers/coupled-spring/generated/checks.json "$RUNNER_TEMP/out/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupled-spring-lean-reports
          path: ${{ runner.temp }}/out
      - run: test ! -e "$RUNNER_TEMP/failed"
