name: Publish fluid reader redirects
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reuse the verified published paper data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code f9ff14bdfddb1f9ba2c02bc81f2bf4a170f799a7 HEAD -- papers tools
          gh run download 45052388926 -n github-pages -D "$RUNNER_TEMP/published"
          tar -xf "$RUNNER_TEMP/published/artifact.tar" -C web/public ./papers
      - name: Build and verify the removal
        env:
          VITE_BASE_PATH: /proof-reader/
        run: |
          npm ci --prefix web
          npm run test:source --prefix web
          python -m unittest discover -s tests -p test_library_redirects.py
          npm run build --prefix web
          test -f web/dist/papers/contextual-embeddings/edition.json
          test ! -e web/dist/papers/euler
          test ! -e web/dist/papers/navier-stokes-paper
          grep -Fq 'https://wcook04.github.io/library/euler/' web/dist/euler/index.html
          grep -Fq 'https://wcook04.github.io/library/navier-stokes/' web/dist/navier-stokes-paper/index.html
          python tools/private_guard.py web/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
